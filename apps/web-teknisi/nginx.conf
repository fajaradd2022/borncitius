server {
  listen 3000;
  root /usr/share/nginx/html;

  # API diteruskan ke container API — browser cukup memanggil /api (same-origin),
  # dan APK memakai https://<domain-teknisi>/api.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 30m; # batas upload API 25 MB
    proxy_read_timeout 120s;
  }

  # Aset ber-hash: aman di-cache selamanya.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Service worker harus selalu dicek ulang agar versi baru cepat aktif.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;
}
