<!doctype html>
<!--
  Ditampilkan Capacitor (server.errorPath) bila Android System WebView di
  perangkat lebih lama dari android.minWebViewVersion. Sengaja HTML/CSS polos
  tanpa JavaScript, agar tetap tampil di WebView lama sekalipun.
-->
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perlu pembaruan</title>
  <style>
    body { margin: 0; font-family: sans-serif; color: #18181b; background: #fff; }
    main { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 32px 24px; box-sizing: border-box; text-align: center; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    p { font-size: 15px; line-height: 1.5; color: #52525b; margin: 0 0 12px; }
    ol { text-align: left; font-size: 15px; line-height: 1.6; color: #3f3f46; padding-left: 20px; }
    b { color: #18181b; }
  </style>
</head>
<body>
  <main>
    <h1>Perlu pembaruan sistem</h1>
    <p>Versi <b>Android System WebView</b> di perangkat ini terlalu lama untuk menjalankan BC Teknisi.</p>
    <ol>
      <li>Buka <b>Play Store</b>.</li>
      <li>Cari <b>Android System WebView</b> dan <b>Google Chrome</b>, lalu tekan <b>Perbarui</b>.</li>
      <li>Tutup lalu buka kembali aplikasi BC Teknisi.</li>
    </ol>
  </main>
</body>
</html>
